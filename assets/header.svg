<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Larry, d2r-mythos: reverse engineering and infrastructure for Diablo II: Resurrected">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15110F"/>
      <stop offset="1" stop-color="#0C0A09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C27A"/>
      <stop offset="0.5" stop-color="#C8A45C"/>
      <stop offset="1" stop-color="#8F7236"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#C8A45C" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="320" rx="14"/></clipPath>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .dim  { fill: #7A6F62; }
      .txt  { fill: #D9CFC0; }
      .gold { fill: #C8A45C; }
      .red  { fill: #B8352F; }
      .cur  { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#gold)"/>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#2A2420"/>
  </g>

  <!-- title block -->
  <text x="64" y="112" class="mono" font-size="54" font-weight="700" fill="url(#gold)" letter-spacing="2">LARRY</text>
  <text x="64" y="150" class="mono txt" font-size="19">Diablo II: Resurrected, taken apart and put to work.</text>
  <text x="64" y="178" class="mono dim" font-size="15">reverse engineering · systems · infrastructure · github.com/d2r-mythos</text>

  <!-- terminal -->
  <g transform="translate(700,52)">
    <rect x="0" y="0" width="436" height="216" rx="8" fill="#0A0808" stroke="#2A2420"/>
    <rect x="0" y="0" width="436" height="26" rx="8" fill="#171311"/>
    <rect x="0" y="18" width="436" height="8" fill="#171311"/>
    <circle cx="16" cy="13" r="4.5" fill="#B8352F"/>
    <circle cx="31" cy="13" r="4.5" fill="#8F7236"/>
    <circle cx="46" cy="13" r="4.5" fill="#3E5A3A"/>
    <text x="218" y="17.5" class="mono dim" font-size="11" text-anchor="middle">larry@d2r:~</text>

    <g class="mono" font-size="12.5">
      <text x="14" y="52"><tspan class="gold">$</tspan><tspan class="txt" dx="8">d2r --target 3.3.93847 --dump game.exe</tspan></text>
      <text x="14" y="72" class="dim">  resolving offsets ............ ok, 0 unresolved</text>
      <text x="14" y="92" class="dim">  level generator .............. seeds match game output</text>
      <text x="14" y="112" class="dim">  game tables .................. 91 tables verified</text>
      <text x="14" y="132"><tspan class="gold">$</tspan><tspan class="txt" dx="8">ship --origins boston manchester kualalumpur</tspan></text>
      <text x="14" y="152" class="dim">  bundle 4.1 KB → gate passed → tree verified → switched</text>
      <text x="14" y="172" class="dim">  edge purged ................... 3/3 origins healthy</text>
      <text x="14" y="196"><tspan class="gold">$</tspan><tspan class="txt cur" dx="8">█</tspan></text>
    </g>
  </g>

  <!-- footer line -->
  <text x="64" y="262" class="mono dim" font-size="13">MythosLoader</text>
  <text x="190" y="262" class="mono dim" font-size="13">/</text>
  <text x="212" y="262" class="mono dim" font-size="13">MythosMaphack</text>
  <text x="352" y="262" class="mono dim" font-size="13">/</text>
  <text x="374" y="262" class="mono dim" font-size="13">d2r.org</text>
  <rect x="64" y="276" width="330" height="1" fill="#2A2420"/>
  <text x="64" y="296" class="mono red" font-size="12">read only · no telemetry · one commit, one changelog entry</text>
</svg>
